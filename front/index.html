<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT-practice</title>
    <script type="module" src="./ts/index.js" defer></script>
</head>
<body>
    <button id="pingServer" onclick="pingServer()">ping server</button>

    <div id="start-area">
        <button id="linkServer" onclick="linkServer()">link server</button>
    </div>   
        
    <div id="init-server-area">
            
        <input type="text" id="user_name_input">

        <input type="text" id="user_id_input" disabled>
        
        <button id="send-init-msg" onclick="sendInitMsg()">send init msg</button>
    </div>
        
    <div id="edit-area">

        <textarea id="edit_msg_textarea" rows="6" cols="60" placeholder="input content..."></textarea>
            
        <br class="">

        <button id="calculate-operator">calculate operator</button>

        <button id="send-edit-operator">send operator</button>

        <button id="receive-edit-operator">receive operator</button>

    </div>
        
    <div id="logger" class="logger-area">

        <button id="clear-log" onclick="clearLog()">clear log</button>

        <div id="log_list" class="log-list"></div>

    </div>
        
</br>

</body>
</html>
